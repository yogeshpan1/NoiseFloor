<?xml version="1.0" encoding="UTF-8"?>
<!--
  NoiseFloor brand mark.
  Hand-authored, vector, scales to any size. No external assets, no JS.
  Palette: #0a0a0a (noir) · #d4af37 (gold) · #e74c3c (alert)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NoiseFloor — NF monogram">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f3d27a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8842a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#171717"/>
      <stop offset="80%"  stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Round badge background -->
  <circle cx="256" cy="256" r="240" fill="url(#vignette)" stroke="#222" stroke-width="2"/>

  <!-- Inner ring (signal baseline) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Three concentric "noise floor" arcs (alert crimson) -->
  <g fill="none" stroke="#e74c3c" stroke-linecap="round" opacity="0.85">
    <path d="M 96 320 Q 160 200 256 260 T 416 200" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M 96 360 Q 180 260 256 310 T 416 250" stroke-width="2.5" opacity="0.7"/>
    <path d="M 96 400 Q 200 320 256 360 T 416 300" stroke-width="2"   opacity="0.55"/>
  </g>

  <!-- NF monogram, gold gradient, serif feel -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="url(#goldGrad)">
    <text x="256" y="240" font-size="180" font-weight="700" letter-spacing="-4" filter="url(#softGlow)">NF</text>
  </g>

  <!-- Tagline bar -->
  <g text-anchor="middle" fill="#d4af37" font-family="Georgia, serif" letter-spacing="6">
    <text x="256" y="312" font-size="20" font-weight="500" opacity="0.9">NOISE</text>
    <text x="256" y="338" font-size="20" font-weight="500" opacity="0.9">FLOOR</text>
  </g>

  <!-- Tick marks around the inner ring (12 ticks like a clock face) -->
  <g stroke="#3a3a3a" stroke-width="2">
    <line x1="256" y1="50"  x2="256" y2="62"/>
    <line x1="256" y1="450" x2="256" y2="462"/>
    <line x1="50"  y1="256" x2="62"  y2="256"/>
    <line x1="450" y1="256" x2="462" y2="256"/>
    <line x1="113" y1="113" x2="121" y2="121"/>
    <line x1="391" y1="113" x2="399" y2="121"/>
    <line x1="113" y1="399" x2="121" y2="391"/>
    <line x1="391" y1="399" x2="399" y2="391"/>
  </g>
</svg>
